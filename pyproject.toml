[project]
name = "frappe_s3_attachment"
authors = [{ name = "Frappe", email = "ramesh.ravi@zerodha.com" }]
description = "Frappe app to store File attachments in S3 / S3-compatible object storage"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    "boto3>=1.34.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
